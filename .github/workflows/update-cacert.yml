name: Update CA Certificates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cacert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest cacert.pem
        run: curl -fsSL -o OpenSSL/Sources/Cacert/Resources/cacert.pem https://curl.se/ca/cacert.pem

      - name: Check for changes and commit
        run: |
          if git diff --quiet OpenSSL/Sources/Cacert/Resources/cacert.pem; then
            echo "cacert.pem is up to date."
            exit 0
          fi

          DATE=$(date -u '+%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenSSL/Sources/Cacert/Resources/cacert.pem
          git commit -m "chore: update cacert.pem ($DATE)"
          git push
